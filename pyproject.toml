[project]
name = "isnad"
version = "2.15.0"
description = "Isnād–Rijāl framework for claim-level provenance in multi-agent knowledge systems"
readme = "README.md"
authors = [
    { name = "Ali Zahid Raja", email = "alizahidrajaa@gmail.com" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
keywords = ["provenance", "multi-agent", "trust", "knowledge-base", "epistemology", "isnad", "lineage", "audit", "governance", "ai-safety", "llm-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "pydantic>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg2-binary>=2.9,<3.0",
]

[project.urls]
Homepage = "https://alizahidraja.com/isnad"
Repository = "https://github.com/alizahidraja/isnad"
Documentation = "https://github.com/alizahidraja/isnad#readme"
Paper = "https://arxiv.org/abs/2607.24117"
Benchmark = "https://github.com/alizahidraja/isnad/blob/main/bench/docs/RESULTS.md"
Issues = "https://github.com/alizahidraja/isnad/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.15.20,<0.16",
    "mypy>=1.11",
    "pre-commit>=3.8",
]
anthropic = [
    "anthropic>=0.40",
]
langchain = [
    "langchain-core>=0.3",
]
langgraph = [
    "langgraph>=0.2",
]
crewai = [
    "crewai>=0.80",
]
llamaindex = [
    "llama-index-core>=0.11",
]
mcp = [
    "mcp>=1.0",
]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]
nli = [
    "sentence-transformers>=3.0",
]
all = [
    "isnad[dev,anthropic,langchain,langgraph,crewai,llamaindex,api,nli,mcp]",
]

[project.scripts]
isnad = "isnad.cli.main:main"

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
preview = true

[tool.mypy]
strict = true
python_version = "3.12"
warn_unreachable = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "sqlalchemy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "anthropic"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "cryptography.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langchain_core.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sentence_transformers"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "isnad.integrations.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "isnad.critics.eval"
ignore_errors = true

[[tool.mypy.overrides]]
module = "isnad.api.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "isnad.core.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "isnad.cli.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
# NLI/LLM critics download large models or need API keys, so they are
# excluded from the default (CI) run.  Run them explicitly with:
#   uv run pytest -m nli          # semantic critics (downloads ~500MB)
#   uv run pytest -m llm          # LLM critic (needs ANTHROPIC_API_KEY)
markers = [
    "nli: semantic critics that download sentence-transformers models",
    "llm: LLM-backed critic that needs an API key",
]
addopts = "-m 'not nli and not llm'"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20,<0.16",
    "fastapi>=0.115",
    "httpx>=0.28",
    "langgraph>=0.2",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "E501", "B007", "F401", "F541", "F811", "F841", "I001", "E741"]
"experiments/*" = ["E402", "E501", "E741", "N806", "B007", "C401", "F841", "B905", "F401", "F541", "I001", "SIM103", "SIM115", "SIM108"]
"src/isnad/api/*" = ["B008", "E501", "E402", "E741", "B904"]
"src/isnad/core/corroboration.py" = ["E402"]
"src/isnad/critics/embedding.py" = ["SIM102"]
"src/isnad/api/auth.py" = ["C416"]
