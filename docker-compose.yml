version: "3.9"

services:
  api:
    build: .
    ports:
      # Bind to loopback by default: the audit view exposes quarantined claim
      # text, so the API should not be exposed on all interfaces out of the box.
      - "127.0.0.1:8000:8000"
    environment:
      # API keys are injected from the host environment — no hardcoded
      # credential ships in the compose file (issue #93). Fail-closed: with
      # ISNAD_API_KEYS unset, authenticated endpoints return 503.
      - ISNAD_API_KEYS=${ISNAD_API_KEYS:-}
      - ISNAD_DATABASE_URL=${ISNAD_DATABASE_URL:-postgresql://isnad:${POSTGRES_PASSWORD:?}@db:5432/isnad}
      - ISNAD_POLICY=${ISNAD_POLICY:-bayesian}
      - ISNAD_CORS_ORIGINS=${ISNAD_CORS_ORIGINS:-}
      - SENTENCE_TRANSFORMERS_HOME=/app/.cache/sentence_transformers
    volumes:
      - nli_cache:/app/.cache/sentence_transformers
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      # Credentials are injected from the host environment. POSTGRES_PASSWORD
      # is required (no default) so a stock `docker compose up` cannot create a
      # guessable database.
      POSTGRES_USER: ${POSTGRES_USER:-isnad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-isnad}
    ports:
      # Do not expose the database to the host by default. Override with
      # POSTGRES_PORT_PUBLISH if a local connection is needed.
      - "${POSTGRES_PORT_PUBLISH:-127.0.0.1:}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-isnad}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT_PUBLISH:-127.0.0.1:}:6379"

  prometheus:
    image: prom/prometheus
    ports:
      - "${PROMETHEUS_PORT_PUBLISH:-127.0.0.1:}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

volumes:
  pgdata:
  nli_cache:
