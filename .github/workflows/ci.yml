name: CI

on:
  push:
    branches: [main, working]
  pull_request:
    branches: [main, working]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: isnad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # Install the dev group + langchain-core only. The nli/llm extras pull
        # sentence-transformers/torch (~2GB) and are excluded from the default
        # run (`-m "not nli and not llm"`), so installing them wastes time and
        # slows test collection with an eager torch import.
        run: uv sync --extra langchain

      - name: Migrate (Postgres)
        env:
          ISNAD_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/isnad_test
        run: uv run alembic upgrade head

      - name: Lint (ruff)
        run: uv run ruff check src/isnad tests examples bench experiments

      - name: Format check (ruff)
        run: uv run ruff format --check src/isnad tests examples bench experiments

      - name: Type check (mypy)
        run: uv run mypy src/isnad bench

      - name: Test (pytest)
        run: uv run pytest -v --tb=short --cov=src/isnad --cov-report=term-missing --cov-fail-under=88
