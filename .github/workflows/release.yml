name: Release

# Triggered manually from the Actions tab, or on a push of a v* tag.
# Bumps the version, tags, and publishes to PyPI via Trusted Publishing.
#
# To cut a release: bump the version in pyproject.toml, commit, push, then
# push a tag matching v*.  (Tag push is the release trigger; a "bump:"
# commit message no longer fires this workflow.)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run tests before release
        run: |
          uv sync --extra langchain
          uv run pytest -q --tb=short

      - name: Build
        run: |
          rm -rf dist
          uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create git tag
        run: |
          VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          TAG="v${VERSION}"
          # Tag only if it doesn't already exist (idempotent on re-runs).
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping."
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "Created and pushed tag $TAG"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          TAG="v${VERSION}"
          # A formal GitHub Release (not just a tag) so "what's new" is
          # visible and Zenodo can archive per version.  Idempotent.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping."
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
            echo "Created GitHub Release $TAG"
          fi
