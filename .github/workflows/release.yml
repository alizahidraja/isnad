name: Release

# Triggered manually from the Actions tab, or on a push to main with a
# version-bump commit message.  Bumps the version, tags, and publishes
# to PyPI.
#
# Branch flow (see CONTRIBUTING.md):
#   feature/*  ->  working  (CI runs)  ->  main  (this workflow releases)

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "CITATION.cff"
      - "src/isnad/__init__.py"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Run tests before release
        run: |
          uv sync --extra langchain
          uv run pytest -q --tb=short

      - name: Build
        run: |
          rm -rf dist
          uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        # Trusted Publishing (OIDC): no token secret. PyPI must have this repo
        # registered as a trusted publisher (workflow name: release.yml).

      - name: Create git tag
        run: |
          VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          TAG="v${VERSION}"
          # Tag only if it doesn't already exist (idempotent on re-runs).
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping."
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "Created and pushed tag $TAG"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          TAG="v${VERSION}"
          # A formal GitHub Release (not just a tag) so "what's new" is
          # visible and Zenodo can archive per version.  Idempotent.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping."
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
            echo "Created GitHub Release $TAG"
          fi
