name: Release

# Triggered manually from the Actions tab, or on a push to main with a
# version-bump commit message.  Bumps the version, tags, and publishes
# to PyPI.
#
# Branch flow (see CONTRIBUTING.md):
#   feature/*  ->  working  (CI runs)  ->  main  (this workflow releases)

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "CITATION.cff"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: contains(github.event.head_commit.message, 'bump:') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run tests before release
        run: |
          uv sync --extra langchain
          uv run pytest -q --tb=short

      - name: Build
        run: |
          rm -rf dist
          uv build

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish

      - name: Create git tag
        run: |
          VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          TAG="v${VERSION}"
          # Tag only if it doesn't already exist (idempotent on re-runs).
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping."
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "Created and pushed tag $TAG"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          TAG="v${VERSION}"
          # A formal GitHub Release (not just a tag) so "what's new" is
          # visible and Zenodo can archive per version.  Idempotent.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping."
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
            echo "Created GitHub Release $TAG"
          fi
