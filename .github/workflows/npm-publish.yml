name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      unpublish_version:
        description: "Version to unpublish (e.g. 2.23.0) — leave empty to publish"
        required: false
  push:
    tags:
      - "js-v*"

jobs:
  publish:
    if: ${{ !inputs.unpublish_version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install, build, test, and publish
        # `npm publish` runs `prepublishOnly` (build + test) first, so a failed
        # golden-vector test blocks the publish.
        run: |
          npm ci
          npm publish
        working-directory: js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  unpublish:
    if: ${{ inputs.unpublish_version }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Unpublish version
        # npm forbids 2FA-bypass granular tokens from `unpublish` (destructive),
        # so recover via deprecate + restore `latest` to the verifier's 0.1.x track.
        run: |
          npm deprecate "isnad@${{ inputs.unpublish_version }}" "mistaken publish - use the verifier 0.1.x track" || true
          npm dist-tag add isnad@0.1.0 latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
