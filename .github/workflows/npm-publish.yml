name: Publish npm package

on:
  workflow_dispatch:
  push:
    tags:
      - "js-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install, build, test, and publish
        # `npm publish` runs `prepublishOnly` (build + test) first, so a failed
        # golden-vector test blocks the publish.
        run: |
          npm ci
          npm publish
        working-directory: js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
